name: Release

# On staging it only checks that the desktop apps build. On master, which changes only through a
# pull request from staging, it releases the version in pyproject.toml: it builds the apps and
# creates the tag vX.Y.Z and its GitHub Release, unless that version is already released. Each
# promotion bumps the version, so it always touches pyproject.toml.
on:
  push:
    branches: [master, staging]
    paths: [desktop/**, world/**, .github/workflows/release.yml, pyproject.toml, uv.lock]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" = master ] && ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  desktop:
    needs: version
    if: github.ref_name != 'master' || needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macOS
            app: build/desktop/dist/RailHub.app/Contents/MacOS/RailHub
            archive: build/desktop/RailHub-macOS.zip
          - os: windows-latest
            name: Windows
            app: build/desktop/dist/RailHub/RailHub.exe
            archive: build/desktop/RailHub-Windows.zip
          - os: ubuntu-22.04
            name: Linux
            app: build/desktop/dist/RailHub/RailHub
            archive: build/desktop/RailHub-Linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxrandr2 libxinerama1 libxcursor1 libxi6
      - run: uv run --with pyinstaller python desktop/build.py
      - name: Check the app imports everything
        shell: bash
        env:
          RAILROADS_SMOKE_TEST: "1"
        run: ${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        with:
          name: RailHub-${{ matrix.name }}
          path: ${{ matrix.archive }}

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: >
          gh release create "$TAG" archives/* --target "$GITHUB_SHA"
          --repo "$GITHUB_REPOSITORY" --title "RailHub $TAG" --generate-notes --latest
